[package]
name = "rust-starter"
version = "0.1.0"
edition = "2021"
description = "A minimal Rust project starter."
license = "MIT"

[dependencies]

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
