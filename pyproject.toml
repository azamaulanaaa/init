[project]
name = "python-uv-starter"
version = "0.1.0"
description = "A minimal Python starter using uv, ruff, mypy, and pytest."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["mypy>=1", "pytest>=8", "ruff>=0"]

# Keep this project out of the build path. uv manages the environment only.
[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
