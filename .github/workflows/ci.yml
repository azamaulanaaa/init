name: Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container:
      image: jdxcode/mise@sha256:05360b08fb68ace24d4814adaa6f36371584f6931782ead4891872049667af5a # jdxcode/mise:2026.11.8-debian
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Add a check with one entry below. Set name to the check name.
          # Set install to the full `mise install` command. Set script to
          # the check script path. Use install: '' when the check needs
          # no tool.
          - name: mise
            install: ''
            script: scripts/check-mise.sh
          - name: jactionlint
            install: mise install jactionlint
            script: scripts/check-jactionlint.sh
          - name: bash
            install: mise install shellcheck
            script: scripts/check-bash.sh
          - name: shfmt
            install: mise install shfmt
            script: scripts/check-shfmt.sh
          - name: commits
            install: mise install cocogitto
            script: scripts/check-commits.sh
          - name: markdown
            install: mise install node markdownlint-cli2
            script: scripts/check-markdown.sh
          - name: hadolint
            install: mise install hadolint
            script: scripts/check-hadolint.sh
          - name: dockerfmt
            install: mise install github:reteps/dockerfmt
            script: scripts/check-dockerfmt.sh
          - name: dclint
            install: mise install node npm:dclint
            script: scripts/check-dclint.sh
          - name: zizmor
            install: mise install zizmor
            script: scripts/check-zizmor.sh
    steps:
      - name: Check out the repository
        if: matrix.name != 'commits'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the repository with full history
        if: matrix.name == 'commits'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install tools
        if: matrix.install != ''
        run: ${{ matrix.install }}
      - name: Trust the checkout directory
        if: matrix.name == 'commits'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the check
        run: ${{ matrix.script }}
